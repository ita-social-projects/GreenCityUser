trigger:
  branches:
    include:
      - dev
      - master
  paths:
    include:
      - greencity-alloy-chart/**

pr: none

pool:
  vmImage: ubuntu-latest


stages:
  - stage: Deploy
    displayName: Deploy Grafana Alloy
    jobs:
      - deployment: DeployAlloy
        displayName: Deploy Alloy via Helm
        environment: 'prod'
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: HelmInstaller@0
                  inputs:
                    helmVersion: '3.9.0'
                    installKubectl: true

                - task: HelmDeploy@0
                  displayName: Helm upgrade/install Alloy
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: 'k8s-stage'
                    namespace: 'default'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(Build.SourcesDirectory)/greencity-alloy-chart'
                    releaseName: 'alloy'
                    valueFile: '$(Build.SourcesDirectory)/greencity-alloy-chart/values.yaml'
                    arguments: '--debug'
