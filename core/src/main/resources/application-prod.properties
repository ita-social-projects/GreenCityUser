# Datasource
spring.datasource.url=${JAWSDB_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DRIVER}
spring.datasource.hikari.maximumPoolSize=${POOL_SIZE}
server.port=8060

# Liquibase
spring.liquibase.url=${JAWSDB_URL}
spring.liquibase.user=${DATABASE_USER}
spring.liquibase.password=${DATABASE_PASSWORD}
spring.liquibase.enabled=${LIQUIBASE_ENABLE}
spring.liquibase.change-log=${LIQUIBASE_LOG}

# Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_CONFIG}
spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=${JDBC_LOB}

# Mail sender
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_ENABLE}
address=${BACKEND_ADDRESS}
client.address=${CLIENT_ADDRESS}
sender.email.address=${SENDER_EMAIL_ADDRESS}
greenoffice.email.address=${GREEN_OFFICE_EMAIL_ADDRESS}
tgbotfeedbacks.email.address=${TG_BOT_FEEDBACKS_EMAIL_ADDRESS}
google.clientId=${GOOGLE_CLIENT_ID}
google.clientId.manager=${GOOGLE_CLIENT_ID_MANAGER}

# Tokens expiration time
accessTokenValidTimeInMinutes=${TOKEN_ACCESS_TIME}
refreshTokenValidTimeInMinutes=${TOKEN_REFRESH_TIME}
tokenKey=${TOKEN_KEY}
verifyEmailTimeHour=${VERIFY_EMAIL}

# Logger
logging.level.root=${LOG_LEVEL_ROOT}
logging.level.greencity.exception.handler.CustomExceptionHandler=${LOG_EXCEPTION_HANDLER}
logging.file.path=${LOG_PATH}
logging.file.name=${LOG_FILE}
logging.pattern.file=${LOG_PATTERN}
# RabbitMQ
messaging.rabbit.email.topic=${EMAIL_TOPIC}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
# Cache
spring.cache.caffeine.spec=${CACHE_SPEC}
#Cloud Storage
bucketName=${BUCKET_NAME}
staticUrl=${STATIC_URL}
# File upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
# Time after a user last activity time to check if a user is online
greencity.time.after.last.activity=60000

#RestTemplate
greencity.server.address = ${GREENCITY_SERVER_ADDRESS}
greencityubs.server.address = ${GREENCITY_UBS_SERVER_ADDRESS}
greencitychat.server.address = ${GREENCITY_CHAT_SERVER_ADDRESS}

#WebClient
webclient.connection-timeout-millis=5000
webclient.response-timeout-millis=5000

#Thymeleaf
spring.web.resources.static-locations=classpath:/static/

#External URLs
greencity.authorization.googleApiKey=${GOOGLE_API_KEY}
#Swagger
springdoc.swagger-ui.doc-expansion=none

#BruteForceSettings
bruteForceSettings.maxAttempts=${MAX_ATTEMPTS:5}
bruteForceSettings.blockTimeInMinutes=${BLOCK_TIME_IN_MINUTES:5}

#Testers
testers.sign-in-token=${SIGN_IN_TOKEN}

#AzureCloudStorage
azure.connection.string=${AZURE_CONNECTION_STRING}
azure.container.name=${AZURE_CONTAINER_NAME}