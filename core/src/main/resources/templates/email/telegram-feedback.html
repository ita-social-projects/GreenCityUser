<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Новий відгук</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #F5F6F6;
            font-family: Lato, Arial, sans-serif;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            text-align: center;
            background-color: #87BC1E;
            color: white;
            padding: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .content {
            padding: 26px;
            font-size: 16px;
            line-height: 1.5;
            color: #333333;
        }

        .content p {
            margin: 10px 0;
        }

        .label {
            font-weight: bold;
            color: #555555;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="header">
        <h2>Новий відгук від користувача Telegram-бота</h2>
    </div>
    <div class="content">
        <p><span class="label">ID чату:</span> <span th:text="${chatId}"></span></p>
        <p><span class="label">Ім'я користувача:</span> <span th:text="${name}"></span></p>
        <p><span class="label">Рейтинг:</span> <span th:text="${rating}"></span></p>
        <p class="label">Коментар:</p>
        <p th:text="${comment}"></p>
    </div>
</div>
</body>
</html>
