<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Login with Facebook</title>
    <script async defer crossorigin="anonymous"
            src="https://connect.facebook.net/en_US/sdk.js"></script>
    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId      : '964118242488651',
                cookie     : true,
                xfbml      : true,
                version    : 'v17.0'
            });

            FB.AppEvents.logPageView();
        };

        function loginWithFacebook() {
            FB.login(function(response) {
                if (response.authResponse) {
                    FB.api('/me', {fields: 'name,email'}, function(user) {
                        console.log('User:', user);
                        console.log('response: ', response)
                        console.log('Access Token: ', response.authResponse.accessToken)
                        fetch('https://200a-91-245-77-57.ngrok-free.app/facebookSecurity/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'ngrok-skip-browser-warning': 'true'
                            },
                            mode: 'cors',
                            credentials: 'include',
                            body: JSON.stringify({
                                accessToken: response.authResponse.accessToken,
                                userID: user.id,
                                name: user.name,
                                email: user.email
                            })
                        })
                            .then(res => res.text())
                            .then(text => {
                                try {
                                    const data = JSON.parse(text);
                                    console.log('Server response:', data);
                                    if (data.status === 'success') {
                                        localStorage.setItem('authToken', data.token);
                                        window.location.href = data.redirectUrl;
                                    }
                                } catch (error) {
                                    console.log('Error parsing JSON:', text);
                                }
                            })
                            .catch(error => console.log('Error:', error));

                    });
                }
            }, {scope: 'email'});
            const authToken = localStorage.getItem('authToken');
            if (authToken) {
                fetch('https://your-api-endpoint.com/protected-route', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                })
                    .then(res => res.json())
                    .then(data => console.log('Protected data:', data))
                    .catch(err => console.log('Error:', err));
            }

        }
    </script>
</head>
<body>
<button onclick="loginWithFacebook()">Увійти через Facebook</button>
</body>
</html>
