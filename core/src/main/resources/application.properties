spring.profiles.active=${PROFILE:dev}

#External URLs
greencity.authorization.googleApiKey=${GOOGLE_API_KEY}

#Swagger
springdoc.swagger-ui.doc-expansion=none

# Email for service-to-service communication
greencity.authorization.service-email=${SPRING_LIQUIBASE_PARAMETERS_SERVICE_EMAIL}
# Email for service-to-service communication with GreenCityUser
spring.liquibase.parameters.service-email=${SPRING_LIQUIBASE_PARAMETERS_SERVICE_EMAIL}
#WebSockets
spring.messaging.stomp.websocket.allowed-origins=\
 https://www.greencity.cx.ua, \
  https://www.greencity.cx.ua/, \
  https://www.greencity.cx.ua/*, \
  https://greencity.greencity.cx.ua, \
  https://greencity.greencity.cx.ua/, \
  https://greencity.greencity.cx.ua/*, \
  https://greencity-user.greencity.cx.ua, \
  https://greencity-user.greencity.cx.ua/, \
  https://greencity-user.greencity.cx.ua/*, \
  https://www.pick-up.city, \
  https://www.pick-up.city/, \
  https://www.pick-up.city/*, \
  http://localhost:4200, \
  http://localhost:4200/, \
  http://localhost:4200/*, \
  http://localhost:4205, \
  http://localhost:4200/, \
  http://localhost:4205/*

#Googleapis
google.resource.userInfoUri=https://www.googleapis.com/oauth2/v3/userinfo?access_token=
#FaceBookAPI
facebook.resource.userInfoUri=https://graph.facebook.com/v22.0/me?fields=id,name,email,picture&access_token=